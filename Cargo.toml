[package]
edition      = "2024"
name         = "epd-weather"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "epd-weather"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
] }
# epd ----
epdsi = "0.1.3"
embedded-hal-bus = "0.3.0 "
embedded-graphics = "0.8.2"
# ----
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
der = { version = "0.8.2", features = ["heapless"] }
embassy-net = { version = "0.9.1", features = [
  "dhcpv4", "medium-ethernet",
  "tcp",
  "udp",
  "dns"
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32",
  "unstable",
  "wifi",
] }

esp-println = { version = "0.13", features = ["esp32"] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
  
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"


serde = { version = "1.0", default-features = false, feature = ["derive","alloc"]}
#serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
reqwless = { version = "0.14.0", default-features = false, features = ["embedded-tls", "log"] }
heapless = {version = "0.9.3", features = ["serde"]}
serde-json-core = "0.6.0"
profont = "0.7.0"
tinybmp = "0.7.0"
chrono = {version= "0.4.45",default-features = false}

#mbedtls-rs = { version = "0.1.0" }
# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'


[lints.clippy]
pedantic = { level = "deny", priority = -1 }
